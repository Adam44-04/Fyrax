
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FYRAX 0.1</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    background: #888;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#info {
    position: fixed;
    top: 12px;
    left: 12px;
    color: white;
    font-size: 14px;
    z-index: 5;
    pointer-events: none;
}

#joystick {
    position: fixed;
    display: none;
    width: 120px;
    height: 120px;
    border: 2px solid #ffffffaa;
    background: #ffffff30;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
}

#knob {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: white;
    transform: translate(-50%, -50%);
}
</style>
</head>

<body>

<div id="info">FYRAX 0.1</div>

<div id="joystick">
    <div id="knob"></div>
</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

// SCÈNE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x888888);

// CAMÉRA
const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

// MOTEUR GRAPHIQUE
const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

// LUMIÈRES
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2));

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(5, 10, 5);
scene.add(sun);

// SOL GRIS
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(300, 300),
    new THREE.MeshStandardMaterial({ color: 0x777777 })
);

floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// JOUEUR : CARRÉ
const player = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 1, 0.8),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
);

player.position.y = 0.5;
scene.add(player);

// POSITION DE LA CAMÉRA
camera.position.set(0, 5, 8);
camera.lookAt(player.position);

// DÉTECTION DES COMMANDES
const touchDevice =
    navigator.maxTouchPoints > 0 ||
    window.matchMedia("(pointer: coarse)").matches;

const keys = {};

window.addEventListener("keydown", event => {
    keys[event.key.toLowerCase()] = true;
});

window.addEventListener("keyup", event => {
    keys[event.key.toLowerCase()] = false;
});

// JOYSTICK DYNAMIQUE À DROITE
const joystick = document.getElementById("joystick");
const knob = document.getElementById("knob");

let activeTouch = null;
let joyX = 0;
let joyY = 0;

function moveJoystick(x, y) {
    let dx = x - joystickCenterX;
    let dy = y - joystickCenterY;

    const maxDistance = 40;
    const distance = Math.hypot(dx, dy);

    if (distance > maxDistance) {
        dx = dx / distance * maxDistance;
        dy = dy / distance * maxDistance;
    }

    joyX = dx / maxDistance;
    joyY = dy / maxDistance;

    knob.style.left = `calc(50% + ${dx}px)`;
    knob.style.top = `calc(50% + ${dy}px)`;
}

let joystickCenterX = 0;
let joystickCenterY = 0;

renderer.domElement.addEventListener("pointerdown", event => {
    if (!touchDevice || event.pointerType !== "touch") return;
    if (event.clientX < window.innerWidth / 2) return;
    if (activeTouch !== null) return;

    activeTouch = event.pointerId;

    joystickCenterX = event.clientX;
    joystickCenterY = event.clientY;

    joystick.style.left = joystickCenterX + "px";
    joystick.style.top = joystickCenterY + "px";
    joystick.style.display = "block";

    moveJoystick(event.clientX, event.clientY);
});

window.addEventListener("pointermove", event => {
    if (event.pointerId !== activeTouch) return;

    moveJoystick(event.clientX, event.clientY);
});

function releaseJoystick(event) {
    if (event.pointerId !== activeTouch) return;

    activeTouch = null;
    joyX = 0;
    joyY = 0;
    joystick.style.display = "none";
}

window.addEventListener("pointerup", releaseJoystick);
window.addEventListener("pointercancel", releaseJoystick);

// DÉPLACEMENT
function animate() {
    requestAnimationFrame(animate);

    let x = 0;
    let z = 0;

    if (touchDevice) {
        x = joyX;
        z = joyY;
    } else {
        if (keys["d"] || keys["arrowright"]) x += 1;
        if (keys["q"] || keys["a"] || keys["arrowleft"]) x -= 1;
        if (keys["s"] || keys["arrowdown"]) z += 1;
        if (keys["z"] || keys["w"] || keys["arrowup"]) z -= 1;
    }

    const length = Math.hypot(x, z);

    if (length > 1) {
        x /= length;
        z /= length;
    }

    const speed = 0.12;

    player.position.x += x * speed;
    player.position.z += z * speed;

    // CAMÉRA QUI SUIT LE JOUEUR
    const cameraTarget = new THREE.Vector3(
        player.position.x,
        player.position.y + 5,
        player.position.z + 8
    );

    camera.position.lerp(cameraTarget, 0.08);

    camera.lookAt(
        player.position.x,
        player.position.y,
        player.position.z
    );

    renderer.render(scene, camera);
}

animate();

// ADAPTATION À LA TAILLE DE L'ÉCRAN
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
